<!DOCTYPE html>
<html lang="mg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formation Pro & Services</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    
    .card { background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 450px; border: 1px solid #334155; }
    h2 { margin-bottom: 8px; color: #38bdf8; text-align: center; font-size: 22px; font-weight: 800; }
    p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 20px; font-size: 14px; }
    
    /* PRICING TABLE */
    .prices-box { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; margin-bottom: 15px; }
    .price-item { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; border-bottom: 1px dashed #334155; }
    .price-item:last-child { border-bottom: none; }
    .price-name { color: #cbd5e1; font-weight: 600; }
    .price-val { color: #38bdf8; font-weight: bold; }

    /* MVOLA BOX WITH COPY */
    .mvola-box { background: #064e3b; border: 1px solid #059669; padding: 12px; border-radius: 10px; margin-bottom: 15px; text-align: center; }
    .mvola-title { font-size: 13px; color: #a7f3d0; margin-bottom: 4px; }
    .mvola-row { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 6px 0; }
    .mvola-number { font-size: 20px; font-weight: bold; color: #34d399; letter-spacing: 1px; }
    .btn-copy { background: #059669; color: white; border: none; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; }
    .btn-copy:active { background: #10b981; }

    /* FORM INPUTS */
    .input-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 13px; font-weight: 600; }
    input { width: 100%; padding: 11px; background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: #38bdf8; }
    
    /* BUTTONS */
    .btn { width: 100%; padding: 13px; background-color: #0284c7; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn:hover { background-color: #0369a1; }
    
    .switch-btn { background: none; color: #38bdf8; font-size: 13px; text-decoration: underline; margin-top: 15px; border: none; width: 100%; cursor: pointer; }
    #message { margin-top: 12px; text-align: center; font-size: 13px; font-weight: bold; line-height: 1.4; }

    /* CONTACT / CONFIRMATION SECTION */
    #contact-section { display: none; margin-top: 20px; border-top: 1px solid #334155; padding-top: 15px; }
    .contact-title { font-size: 14px; color: #cbd5e1; text-align: center; margin-bottom: 12px; font-weight: bold; }
    .btn-whatsapp { display: block; width: 100%; padding: 12px; background-color: #25d366; color: white; text-align: center; text-decoration: none; border-radius: 8px; font-weight: bold; margin-bottom: 10px; }
    .btn-facebook { display: block; width: 100%; padding: 12px; background-color: #1877f2; color: white; text-align: center; text-decoration: none; border-radius: 8px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2 id="form-title">Se connecter</h2>
    <p class="subtitle" id="form-subtitle">Ampidiro ny kaontinao hidirana</p>
    
    <!-- TARIF FORMATION -->
    <div class="prices-box" id="prices-container" style="display: none;">
      <div class="price-item">
        <span class="price-name">Formation Boost Facebook</span>
        <span class="price-val">5 000 Ar</span>
      </div>
      <div class="price-item">
        <span class="price-name">Formation Web Pro</span>
        <span class="price-val">12 000 Ar</span>
      </div>
      <div class="price-item">
        <span class="price-name">Formation BandLab</span>
        <span class="price-val">4 000 Ar</span>
      </div>
    </div>

    <!-- PAYMENT MVOLA -->
    <div class="mvola-box" id="mvola-container" style="display: none;">
      <div class="mvola-title">📲 Payment MVola:</div>
      <div class="mvola-row">
        <span class="mvola-number" id="mvola-num">0385538889</span>
        <button type="button" class="btn-copy" onclick="copyMvola()">Copier</button>
      </div>
      <p style="font-size: 11px; color: #a7f3d0;">Kitiho ny Copier mba handefasana ny sarasara</p>
    </div>

    <!-- FORMULAIRE -->
    <form id="auth-form">
      <div class="input-group">
        <label>Adresse Email</label>
        <input type="email" id="email" placeholder="Ohatra: mpianatra@gmail.com" required>
      </div>
      
      <div class="input-group">
        <label>Mot de Passe</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="input-group" id="ref-container" style="display: none;">
        <label>Référence / Code MVola</label>
        <input type="text" id="ref_code" placeholder="Ohatra: 123456789">
      </div>
      
      <button type="submit" class="btn" id="btn-submit">Se connecter</button>
    </form>

    <div id="message"></div>

    <!-- CONTACT / WHATSAPP & FACEBOOK BUTTONS -->
    <div id="contact-section">
      <div class="contact-title">✅ Confirmé! Mifandraisa amin'ny Admin:</div>
      <a href="https://wa.me/261382550809" target="_blank" class="btn-whatsapp">
        💬 WhatsApp: 038 25 508 09
      </a>
      <a href="https://www.facebook.com/profile.php?id=61579196451031" target="_blank" class="btn-facebook">
        🌐 Pejy Facebook
      </a>
    </div>

    <button class="switch-btn" onclick="toggleMode()" id="btn-toggle">Mbola tsy manana kaonty? S'inscrire</button>
  </div>

  <script>
    let isSignUp = false; // Mipoitra voalohany: Se connecter

    const formTitle = document.getElementById('form-title');
    const formSubtitle = document.getElementById('form-subtitle');
    const btnSubmit = document.getElementById('btn-submit');
    const btnToggle = document.getElementById('btn-toggle');
    const pricesContainer = document.getElementById('prices-container');
    const mvolaContainer = document.getElementById('mvola-container');
    const refContainer = document.getElementById('ref-container');
    const refInput = document.getElementById('ref_code');
    const messageDiv = document.getElementById('message');
    const contactSection = document.getElementById('contact-section');

    function toggleMode() {
      isSignUp = !isSignUp;
      messageDiv.innerText = "";
      contactSection.style.display = "none";

      if (isSignUp) {
        // S'INSCRIRE MODE
        formTitle.innerText = "S'inscrire";
        formSubtitle.innerText = "Misoratra anarana ary fidio ny formation-nao";
        btnSubmit.innerText = "S'inscrire sy Confirmer";
        btnToggle.innerText = "Efa manana kaonty? Se connecter";
        
        pricesContainer.style.display = "block";
        mvolaContainer.style.display = "block";
        refContainer.style.display = "block";
        refInput.required = true;
      } else {
        // SE CONNECTER MODE
        formTitle.innerText = "Se connecter";
        formSubtitle.innerText = "Ampidiro ny kaontinao hidirana";
        btnSubmit.innerText = "Se connecter";
        btnToggle.innerText = "Mbola tsy manana kaonty? S'inscrire";
        
        pricesContainer.style.display = "none";
        mvolaContainer.style.display = "none";
        refContainer.style.display = "none";
        refInput.required = false;
      }
    }

    function copyMvola() {
      const num = document.getElementById('mvola-num').innerText;
      navigator.clipboard.writeText(num);
      alert("Voacopie ny laharana MVola: " + num);
    }

    document.getElementById('auth-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      let users = JSON.parse(localStorage.getItem('registeredUsers')) || [];

      if (isSignUp) {
        const refCode = refInput.value.trim();
        
        if (!refCode) {
          messageDiv.style.color = "#f87171";
          messageDiv.innerText = "Ampidiro ny Code Référence MVola!";
          return;
        }

        const existingUser = users.find(u => u.email === email);
        if (existingUser) {
          messageDiv.style.color = "#f87171";
          messageDiv.innerText = "Efa misy mampiasa io email io!";
          return;
        }

        // Enregistrer l'utilisateur
        users.push({ email: email, password: password, refCode: refCode });
        localStorage.setItem('registeredUsers', JSON.stringify(users));

        messageDiv.style.color = "#34d399";
        messageDiv.innerText = "🎉 Tafiditra soa aman-tsara ny fisoratana anarana!";
        contactSection.style.display = "block";

      } else {
        // CONNEXION
        const validUser = users.find(u => u.email === email && u.password === password);
        
        if (validUser) {
          messageDiv.style.color = "#34d399";
          messageDiv.innerText = "🎉 Tafiditra soa aman-tsara!";
          contactSection.style.display = "block";
        } else {
          messageDiv.style.color = "#f87171";
          messageDiv.innerText = "Diso ny email na mot de passe!";
          contactSection.style.display = "none";
        }
      }
    });
  </script>

</body>
</html>
